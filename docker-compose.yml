version: '3.8'

services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mcp-sentinel-proxy
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: mcp-sentinel-dashboard
    ports:
      - "5173:80"
    depends_on:
      - proxy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: mcp-sentinel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
