<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="920" height="320">
  <defs>
    <filter id="meshShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="920" height="320" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#meshShadow)" />

  <text x="40" y="42" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold">10-Layer Zero-Trust Defense Mesh Architecture</text>
  <text x="40" y="64" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13">Sequential defense-in-depth pipeline executing on every intercepted MCP tool call</text>

  <!-- Row 1: Layers 1 to 5 -->
  <g transform="translate(40, 95)">
    <!-- Layer 1 -->
    <rect x="0" y="0" width="155" height="85" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <circle cx="25" cy="25" r="12" fill="#e0e7ff" />
    <text x="25" y="30" fill="#4338ca" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">1</text>
    <text x="45" y="29" fill="#0f172a" font-family="system-ui" font-size="12" font-weight="700">AuthN &amp; Nonce</text>
    <text x="14" y="52" fill="#64748b" font-family="system-ui" font-size="10">HMAC / Signature</text>
    <text x="14" y="68" fill="#64748b" font-family="system-ui" font-size="10">Replay elimination</text>

    <!-- Layer 2 -->
    <rect x="170" y="0" width="155" height="85" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <circle cx="195" cy="25" r="12" fill="#e0e7ff" />
    <text x="195" y="30" fill="#4338ca" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">2</text>
    <text x="215" y="29" fill="#0f172a" font-family="system-ui" font-size="12" font-weight="700">Rate Limiter</text>
    <text x="184" y="52" fill="#64748b" font-family="system-ui" font-size="10">Sliding 60s window</text>
    <text x="184" y="68" fill="#64748b" font-family="system-ui" font-size="10">Burst prevention</text>

    <!-- Layer 3 -->
    <rect x="340" y="0" width="155" height="85" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" />
    <circle cx="365" cy="25" r="12" fill="#4f46e5" />
    <text x="365" y="30" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">3</text>
    <text x="385" y="29" fill="#3730a3" font-family="system-ui" font-size="12" font-weight="700">Policy Engine</text>
    <text x="354" y="52" fill="#4338ca" font-family="system-ui" font-size="10">Deny-by-Default</text>
    <text x="354" y="68" fill="#4338ca" font-family="system-ui" font-size="10">Deterministic AST</text>

    <!-- Layer 4 -->
    <rect x="510" y="0" width="155" height="85" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <circle cx="535" cy="25" r="12" fill="#e0e7ff" />
    <text x="535" y="30" fill="#4338ca" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">4</text>
    <text x="555" y="29" fill="#0f172a" font-family="system-ui" font-size="12" font-weight="700">Schema Fuzzer</text>
    <text x="524" y="52" fill="#64748b" font-family="system-ui" font-size="10">Boundary checking</text>
    <text x="524" y="68" fill="#64748b" font-family="system-ui" font-size="10">Prototype pollution</text>

    <!-- Layer 5 -->
    <rect x="680" y="0" width="160" height="85" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="705" cy="25" r="12" fill="#d97706" />
    <text x="705" y="30" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">5</text>
    <text x="725" y="29" fill="#92400e" font-family="system-ui" font-size="12" font-weight="700">FIDO2 Gating</text>
    <text x="694" y="52" fill="#b45309" font-family="system-ui" font-size="10">Hardware key token</text>
    <text x="694" y="68" fill="#b45309" font-family="system-ui" font-size="10">Human approval</text>
  </g>

  <!-- Row 2: Layers 6 to 10 -->
  <g transform="translate(40, 200)">
    <!-- Layer 6 -->
    <rect x="0" y="0" width="155" height="85" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <circle cx="25" cy="25" r="12" fill="#e0e7ff" />
    <text x="25" y="30" fill="#4338ca" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">6</text>
    <text x="45" y="29" fill="#0f172a" font-family="system-ui" font-size="12" font-weight="700">Tenancy Guard</text>
    <text x="14" y="52" fill="#64748b" font-family="system-ui" font-size="10">Namespace isolation</text>
    <text x="14" y="68" fill="#64748b" font-family="system-ui" font-size="10">IDOR traversal block</text>

    <!-- Layer 7 -->
    <rect x="170" y="0" width="155" height="85" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <circle cx="195" cy="25" r="12" fill="#e0e7ff" />
    <text x="195" y="30" fill="#4338ca" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">7</text>
    <text x="215" y="29" fill="#0f172a" font-family="system-ui" font-size="12" font-weight="700">Process Sandbox</text>
    <text x="184" y="52" fill="#64748b" font-family="system-ui" font-size="10">Seccomp profile</text>
    <text x="184" y="68" fill="#64748b" font-family="system-ui" font-size="10">eBPF socket filters</text>

    <!-- Layer 8 -->
    <rect x="340" y="0" width="155" height="85" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <circle cx="365" cy="25" r="12" fill="#e0e7ff" />
    <text x="365" y="30" fill="#4338ca" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">8</text>
    <text x="385" y="29" fill="#0f172a" font-family="system-ui" font-size="12" font-weight="700">State Snapshot</text>
    <text x="354" y="52" fill="#64748b" font-family="system-ui" font-size="10">Pre-mutation state</text>
    <text x="354" y="68" fill="#64748b" font-family="system-ui" font-size="10">Auto-rollback plan</text>

    <!-- Layer 9 -->
    <rect x="510" y="0" width="155" height="85" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" />
    <circle cx="535" cy="25" r="12" fill="#059669" />
    <text x="535" y="30" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">9</text>
    <text x="555" y="29" fill="#065f46" font-family="system-ui" font-size="12" font-weight="700">Stream Redact</text>
    <text x="524" y="52" fill="#047857" font-family="system-ui" font-size="10">Sliding token window</text>
    <text x="524" y="68" fill="#047857" font-family="system-ui" font-size="10">API key scrubber</text>

    <!-- Layer 10 -->
    <rect x="680" y="0" width="160" height="85" rx="10" fill="#fdf4ff" stroke="#d946ef" stroke-width="1.5" />
    <circle cx="705" cy="25" r="12" fill="#c026d3" />
    <text x="705" y="30" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">10</text>
    <text x="725" y="29" fill="#86198f" font-family="system-ui" font-size="12" font-weight="700">Merkle Ledger</text>
    <text x="694" y="52" fill="#a21caf" font-family="system-ui" font-size="10">RFC 6962 SHA-256</text>
    <text x="694" y="68" fill="#a21caf" font-family="system-ui" font-size="10">ZK Inclusion proofs</text>
  </g>
</svg>
