<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="seqBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" rx="14" fill="url(#seqBg)" stroke="#1e293b" stroke-width="1.5" />

  <text x="40" y="45" fill="#f8fafc" font-family="system-ui" font-size="20" font-weight="bold">MCP Sentinel Mesh - Tool Interception &amp; Verification Flow</text>

  <!-- Actor Columns -->
  <!-- 1. Agent -->
  <rect x="60" y="75" width="140" height="40" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
  <text x="130" y="100" fill="#f8fafc" font-family="system-ui" font-size="13" font-weight="600" text-anchor="middle">AI Agent</text>
  <line x1="130" y1="115" x2="130" y2="440" stroke="#334155" stroke-dasharray="4,4" />

  <!-- 2. Sentinel Proxy -->
  <rect x="280" y="75" width="160" height="40" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" />
  <text x="360" y="100" fill="#a5b4fc" font-family="system-ui" font-size="13" font-weight="600" text-anchor="middle">Sentinel Mesh</text>
  <line x1="360" y1="115" x2="360" y2="440" stroke="#4f46e5" stroke-dasharray="4,4" />

  <!-- 3. Human / Key -->
  <rect x="520" y="75" width="140" height="40" rx="8" fill="#1e293b" stroke="#eab308" stroke-width="1.5" />
  <text x="590" y="100" fill="#fef08a" font-family="system-ui" font-size="13" font-weight="600" text-anchor="middle">FIDO2 / Admin</text>
  <line x1="590" y1="115" x2="590" y2="440" stroke="#334155" stroke-dasharray="4,4" />

  <!-- 4. MCP Server -->
  <rect x="720" y="75" width="140" height="40" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
  <text x="790" y="100" fill="#a7f3d0" font-family="system-ui" font-size="13" font-weight="600" text-anchor="middle">MCP Server</text>
  <line x1="790" y1="115" x2="790" y2="440" stroke="#334155" stroke-dasharray="4,4" />

  <!-- Step 1 -->
  <line x1="130" y1="150" x2="355" y2="150" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <text x="245" y="142" fill="#bae6fd" font-family="system-ui" font-size="11" text-anchor="middle">1. invoke_tool(name, args)</text>

  <!-- Step 2 -->
  <rect x="300" y="170" width="120" height="30" rx="6" fill="#312e81" stroke="#6366f1" />
  <text x="360" y="190" fill="#e0e7ff" font-family="system-ui" font-size="10" text-anchor="middle">Policy &amp; Schema Gate</text>

  <!-- Step 3 -->
  <line x1="360" y1="225" x2="585" y2="225" stroke="#f59e0b" stroke-width="2" />
  <text x="475" y="217" fill="#fde68a" font-family="system-ui" font-size="11" text-anchor="middle">2. WebAuthn Challenge Nonce</text>

  <!-- Step 4 -->
  <line x1="590" y1="260" x2="365" y2="260" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" />
  <text x="475" y="252" fill="#fde68a" font-family="system-ui" font-size="11" text-anchor="middle">3. FIDO2 Assertion Validated</text>

  <!-- Step 5 -->
  <line x1="360" y1="295" x2="785" y2="295" stroke="#10b981" stroke-width="2" />
  <text x="575" y="287" fill="#6ee7b7" font-family="system-ui" font-size="11" text-anchor="middle">4. Forward Authenticated Call</text>

  <!-- Step 6 -->
  <line x1="790" y1="330" x2="365" y2="330" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" />
  <text x="575" y="322" fill="#6ee7b7" font-family="system-ui" font-size="11" text-anchor="middle">5. Raw Tool Output</text>

  <!-- Step 7 -->
  <rect x="290" y="350" width="140" height="30" rx="6" fill="#312e81" stroke="#6366f1" />
  <text x="360" y="370" fill="#e0e7ff" font-family="system-ui" font-size="10" text-anchor="middle">Secret Redact &amp; Merkle Log</text>

  <!-- Step 8 -->
  <line x1="360" y1="405" x2="135" y2="405" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" />
  <text x="245" y="397" fill="#bae6fd" font-family="system-ui" font-size="11" text-anchor="middle">6. Clean Sanitized Result</text>
</svg>
