<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" width="920" height="490">
  <defs>
    <linearGradient id="seqLightBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="490" rx="16" fill="url(#seqLightBg)" stroke="#e2e8f0" stroke-width="1.5" />

  <text x="45" y="44" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold">MCP Sentinel Mesh - Interception &amp; Verification Sequence</text>
  <text x="45" y="65" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13">Real-time gatekeeping, WebAuthn challenge, secret redaction, and Merkle audit logging</text>

  <!-- Actor Columns -->
  <!-- 1. AI Agent -->
  <rect x="60" y="85" width="140" height="42" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#boxShadow)" />
  <text x="130" y="111" fill="#1e40af" font-family="system-ui" font-size="13" font-weight="700" text-anchor="middle">AI Agent</text>
  <line x1="130" y1="127" x2="130" y2="455" stroke="#cbd5e1" stroke-dasharray="4,4" />

  <!-- 2. Sentinel Proxy -->
  <rect x="280" y="85" width="160" height="42" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" filter="url(#boxShadow)" />
  <text x="360" y="111" fill="#3730a3" font-family="system-ui" font-size="13" font-weight="700" text-anchor="middle">Sentinel Mesh</text>
  <line x1="360" y1="127" x2="360" y2="455" stroke="#818cf8" stroke-dasharray="4,4" />

  <!-- 3. FIDO2 / Admin -->
  <rect x="520" y="85" width="140" height="42" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#boxShadow)" />
  <text x="590" y="111" fill="#b45309" font-family="system-ui" font-size="13" font-weight="700" text-anchor="middle">FIDO2 / Admin</text>
  <line x1="590" y1="127" x2="590" y2="455" stroke="#cbd5e1" stroke-dasharray="4,4" />

  <!-- 4. MCP Server -->
  <rect x="720" y="85" width="140" height="42" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#boxShadow)" />
  <text x="790" y="111" fill="#065f46" font-family="system-ui" font-size="13" font-weight="700" text-anchor="middle">MCP Server</text>
  <line x1="790" y1="127" x2="790" y2="455" stroke="#cbd5e1" stroke-dasharray="4,4" />

  <!-- Step 1: invoke_tool -->
  <line x1="130" y1="160" x2="355" y2="160" stroke="#0284c7" stroke-width="2" />
  <polygon points="355,160 345,155 345,165" fill="#0284c7" />
  <text x="245" y="152" fill="#0369a1" font-family="system-ui" font-size="12" font-weight="600" text-anchor="middle">1. invoke_tool(name, args)</text>

  <!-- Step 2: Policy & Schema Gate -->
  <rect x="295" y="180" width="130" height="32" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1" />
  <text x="360" y="201" fill="#3730a3" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Policy &amp; Schema Gate</text>

  <!-- Step 3: WebAuthn Challenge Nonce -->
  <line x1="360" y1="235" x2="585" y2="235" stroke="#d97706" stroke-width="2" />
  <polygon points="585,235 575,230 575,240" fill="#d97706" />
  <text x="475" y="227" fill="#b45309" font-family="system-ui" font-size="11" font-weight="600" text-anchor="middle">2. WebAuthn Challenge Nonce</text>

  <!-- Step 4: FIDO2 Assertion Validated -->
  <line x1="590" y1="270" x2="365" y2="270" stroke="#d97706" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="365,270 375,265 375,275" fill="#d97706" />
  <text x="475" y="262" fill="#b45309" font-family="system-ui" font-size="11" font-weight="600" text-anchor="middle">3. FIDO2 Assertion Validated</text>

  <!-- Step 5: Forward Authenticated Call -->
  <line x1="360" y1="305" x2="785" y2="305" stroke="#059669" stroke-width="2" />
  <polygon points="785,305 775,300 775,310" fill="#059669" />
  <text x="575" y="297" fill="#047857" font-family="system-ui" font-size="11" font-weight="600" text-anchor="middle">4. Forward Authenticated Call</text>

  <!-- Step 6: Raw Tool Output -->
  <line x1="790" y1="340" x2="365" y2="340" stroke="#059669" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="365,340 375,335 375,345" fill="#059669" />
  <text x="575" y="332" fill="#047857" font-family="system-ui" font-size="11" font-weight="600" text-anchor="middle">5. Raw Tool Output</text>

  <!-- Step 7: Redact & Merkle Log -->
  <rect x="285" y="360" width="150" height="32" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1" />
  <text x="360" y="381" fill="#065f46" font-family="system-ui" font-size="11" font-weight="700" text-anchor="middle">Secret Redact &amp; Merkle Log</text>

  <!-- Step 8: Clean Sanitized Result -->
  <line x1="360" y1="420" x2="135" y2="420" stroke="#0284c7" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="135,420 145,415 145,425" fill="#0284c7" />
  <text x="245" y="412" fill="#0369a1" font-family="system-ui" font-size="12" font-weight="600" text-anchor="middle">6. Clean Sanitized Result</text>
</svg>
